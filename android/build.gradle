plugins {
    id 'com.android.library'
}

// AGP 9 provides Kotlin unless the host opts out of built-in Kotlin.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9 || project.findProperty("android.builtInKotlin")?.toString() == "false") {
    apply plugin: 'kotlin-android'
}

def getSdkVersion(String overrideProperty, int fallback) {
    def override = project.findProperty(overrideProperty)
    return override == null ? fallback : Math.max(fallback, override.toString().toInteger())
}

// Flutter versions before 3.27 do not provide this extension to plugin modules.
def flutterExtension = project.extensions.findByName("flutter")
def compileSdkVersion = getSdkVersion("ly.img.flutter.compileSdkVersionOverride", flutterExtension?.compileSdkVersion ?: 34)

def getKotlinVersion() {
    def kotlinAndroidPlugin = project.plugins.findPlugin("kotlin-android")
    if (kotlinAndroidPlugin) {
        return kotlinAndroidPlugin.class.package.implementationVersion
    }

    // AGP 9+ supplies built-in Kotlin, which is Kotlin 2 or higher.
    def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
    return agpMajor >= 9 ? "2.0.0" : null
}

def isKotlin2OrHigher() {
    def kotlinVersion = getKotlinVersion()
    if (kotlinVersion) {
        def mainVersion = kotlinVersion.split('-')[0]
        def versionParts = mainVersion.tokenize('.').collect { it.toInteger() }
        return versionParts[0] >= 2
    }
    return false
}

def getComposeVersion() {
    if (isKotlin2OrHigher()) {
        def mainVersion = getKotlinVersion().split('-')[0]
        return mainVersion
    }
    return gradle.ext.has("kotlinCompilerExtensionVersion") ? gradle.ext.kotlinCompilerExtensionVersion : "1.5.3"
}

if (isKotlin2OrHigher()) {
    try {
        project.plugins.apply('org.jetbrains.kotlin.plugin.compose')
    } catch (org.gradle.api.plugins.UnknownPluginException e) {
        logger.lifecycle("Kotlin Compose plugin not available; skipping.")
    }
}

group = "ly.img.camera.flutter.plugin"
version = "1.0-SNAPSHOT"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "ly.img.camera.flutter.plugin"
    }

    compileSdk = compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    if (project.plugins.hasPlugin("kotlin-android")) {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }

    defaultConfig {
        minSdk = 24
        aarMetadata {
            // AGP 9 defaults this to compileSdk; declare the consumer requirement separately.
            minCompileSdk = 34
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }

    buildFeatures {
        compose true
    }

    if (!isKotlin2OrHigher() && agpMajor < 9) {
        composeOptions {
            kotlinCompilerExtensionVersion = getComposeVersion()
        }
    }
}

dependencies {
    api "ly.img:camera:1.84.0-rc.0"
    implementation platform("androidx.compose:compose-bom:2023.05.01")
    implementation "androidx.activity:activity-compose:1.6.1"
    implementation "androidx.activity:activity:1.7.0"
    implementation "com.google.android.material:material:1.8.0"

    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
