pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            name "IMG.LY Artifactory"
            url "https://maven.img.ly/maven"
            mavenContent {
                includeGroup("ly.img")
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.1" apply false
    id "com.android.library" version "9.1.1" apply false
    // AGP 9 provides built-in Kotlin. Declare the Compose Compiler plugin for modules
    // that enable Compose, with its version aligned to the resolved Kotlin version.
    id 'org.jetbrains.kotlin.plugin.compose' version "2.2.20" apply false
    id 'com.github.gmazzo.buildconfig' version "6.0.10" apply false
}

include ":app"

// Internal use only
def editorDir = file("../../../../../../apps/cesdk_android")
if (editorDir.exists() && System.getenv("UBQ_ANDROID_USE_ARTIFACTS") != "true") {
    includeBuild(editorDir) {
        name "camera"
        dependencySubstitution {
            substitute module('ly.img:camera') using project(':camera')
        }
    }
}
// Internal use only
